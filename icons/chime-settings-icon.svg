<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8E8CF0"/>
      <stop offset="100%" stop-color="#5A56D6"/>
    </linearGradient>
    <linearGradient id="bell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F0F0F5"/>
    </linearGradient>
    <radialGradient id="sheen" cx="35%" cy="20%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- macOS風の角丸背景 -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#sheen)"/>

  <!-- ベル本体 -->
  <path d="M64 22
           c-6 0 -11 5 -11 11
           v3
           c-13 3 -20 14 -20 28
           v18
           l-8 10
           h78
           l-8 -10
           v-18
           c0 -14 -7 -25 -20 -28
           v-3
           c0 -6 -5 -11 -11 -11
           z"
        fill="url(#bell)" stroke="#C9C9D8" stroke-width="1.5"/>

  <!-- ベルの舌(下部の丸) -->
  <circle cx="64" cy="100" r="8" fill="url(#bell)" stroke="#C9C9D8" stroke-width="1.5"/>

  <!-- サウンドウェーブ(左右) -->
  <path d="M28 52 q-8 12 0 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M100 52 q8 12 0 24" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
</svg>
